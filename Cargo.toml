[workspace]
resolver = "2"
members = [
    "crates/quartz-core",
    "crates/quartz-cli",
    "crates/quartz-ffi",
]
# apps/shell-tauri/src-tauri 是独立 package（自带空 [workspace] 声明），
# 因为其构建依赖 Tauri 与各平台系统库（webkit2gtk / Xcode / NDK），
# 不纳入本 workspace 的默认 CI 编译范围。见 docs/ROADMAP.md。

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
clap = { version = "4", features = ["derive"] }
tar = "0.4"
xz2 = "0.1"
